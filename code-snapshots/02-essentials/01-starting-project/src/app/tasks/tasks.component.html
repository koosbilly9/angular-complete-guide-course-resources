@if (isAddingTask) {
<app-new-task (cancel)="onCancelAddTask()" (addTask)="onAddTask($event)" />
}

<section id="tasks">
  <header>
    <h2>{{ name }}</h2>
    <menu>
      <button (click)="onStartAddTask(userId)">Add Task</button>
    </menu>
  </header>

  <ul>
    @for (task of selectedUserTasks; track task.id) {
    <li>
      <app-task [task]="task" (complete)="onTaskComplete($event)" />
    </li>
    }
  </ul>
</section>
